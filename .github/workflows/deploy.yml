name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"] # Si tu rama principal se llama 'master', cámbialo a "master"

  # Permite ejecutar este flujo manualmente desde la pestaña Actions
  workflow_dispatch:

# Otorga permisos al GITHUB_TOKEN para hacer el despliegue
permissions:
  contents: read
  pages: write
  id-token: write

# Permite un solo despliegue a la vez
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build project
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Si tu compilador usa otra carpeta (ej. 'build'), cámbialo aquí

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
